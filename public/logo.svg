<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#059669" stroke-width="2"/>
  <!-- Open Quran Book Icon -->
  <g filter="url(#shadow)" transform="translate(24, 28)">
    <!-- Book Stand / Rehal Base -->
    <path d="M12 56 L40 68 L68 56" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 50 L40 68" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Book Page -->
    <path d="M40 48 C28 42 16 46 8 49 L8 16 C16 13 28 9 40 16 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right Book Page -->
    <path d="M40 48 C52 42 64 46 72 49 L72 16 C64 13 52 9 40 16 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Page lines -->
    <line x1="14" y1="24" x2="34" y2="21" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="34" y2="27" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="14" y1="36" x2="34" y2="33" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="46" y1="21" x2="66" y2="24" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="46" y1="27" x2="66" y2="30" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="46" y1="33" x2="66" y2="36" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Center Spine & Noor Glow -->
    <circle cx="40" cy="14" r="3.5" fill="url(#goldGrad)"/>
    <path d="M40 18 L40 48" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>